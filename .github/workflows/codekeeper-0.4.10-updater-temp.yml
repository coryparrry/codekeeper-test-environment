name: Generate verified Codekeeper 0.4.10 installation files

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: codekeeper-test-environment-update-0.4.10
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'chore/update-codekeeper-0.4.10'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/update-codekeeper-0.4.10
          fetch-depth: 0
          persist-credentials: true

      - name: Generate complete verified caller and receipt files
        env:
          HEAD_BRANCH: chore/update-codekeeper-0.4.10
          EXPECTED_VERSION: 0.4.10
          EXPECTED_INTEGRITY: sha512-4A9SskfAAPxJJsd7wBUSFfcaMDYoxlnXAh/w5MvbchiCQJCyeVrGcGeJXuAoXusurF1Mrzyen2gkRZrtQqczjw==
          EXPECTED_SOURCE_COMMIT: 884e380ee31f4dd595ec963f3a0197cdeaf40d68
          OLD_VERSION: 0.4.9
          OLD_INTEGRITY: sha512-nYwFsY/xgc9P7m1jhE4Uf9TGy8CtrpUaHwzJvCabweMmVUft0Pn1ac25JnQFhFMKm7vXYyuOtxiOTH+lhPNHHw==
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p diag/codekeeper-0.4.10

          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_INTEGRITY="$EXPECTED_INTEGRITY" \
            EXPECTED_SOURCE_COMMIT="$EXPECTED_SOURCE_COMMIT" OLD_VERSION="$OLD_VERSION" \
            OLD_INTEGRITY="$OLD_INTEGRITY" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";

          const sourceWorkflowPath = ".github/workflows/codekeeper.yml";
          const sourceReceiptPath = ".github/codekeeper-release.json";
          const generatedWorkflowPath = "diag/codekeeper-0.4.10/codekeeper.yml";
          const generatedReceiptPath = "diag/codekeeper-0.4.10/codekeeper-release.json";
          const workflow = readFileSync(sourceWorkflowPath, "utf8");
          const oldVersion = `package_version: "${process.env.OLD_VERSION}"`;
          const newVersion = `package_version: "${process.env.EXPECTED_VERSION}"`;
          const oldIntegrity = `package_integrity: "${process.env.OLD_INTEGRITY}"`;
          const newIntegrity = `package_integrity: "${process.env.EXPECTED_INTEGRITY}"`;
          const versionCount = workflow.split(oldVersion).length - 1;
          const integrityCount = workflow.split(oldIntegrity).length - 1;
          if (versionCount !== 5 || integrityCount !== 5) {
            throw new Error(`Expected five old package pins; found version=${versionCount}, integrity=${integrityCount}`);
          }
          const updatedWorkflow = workflow
            .split(oldVersion).join(newVersion)
            .split(oldIntegrity).join(newIntegrity);
          if (updatedWorkflow.split(newVersion).length - 1 !== 5 || updatedWorkflow.split(newIntegrity).length - 1 !== 5) {
            throw new Error("Not every Codekeeper mode received the exact 0.4.10 release pin");
          }
          writeFileSync(generatedWorkflowPath, updatedWorkflow);

          const receipt = JSON.parse(readFileSync(sourceReceiptPath, "utf8"));
          receipt.package.version = process.env.EXPECTED_VERSION;
          receipt.package.integrity = process.env.EXPECTED_INTEGRITY;
          receipt.source.commit = process.env.EXPECTED_SOURCE_COMMIT;
          receipt.managedFiles[sourceWorkflowPath] = createHash("sha256").update(updatedWorkflow).digest("hex");
          writeFileSync(generatedReceiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          ruby -e 'require "yaml"; YAML.load_file("diag/codekeeper-0.4.10/codekeeper.yml")'
          git diff --check
          git add diag/codekeeper-0.4.10
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: generate verified Codekeeper 0.4.10 installation files'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
