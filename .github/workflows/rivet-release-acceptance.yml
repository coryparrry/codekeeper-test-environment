name: Verify Rivet acceptance App

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify live App identity and installation authority
        env:
          APP_CLIENT_ID: ${{ vars.RIVET_APP_CLIENT_ID }}
          APP_SLUG: ${{ vars.RIVET_APP_BOT_LOGIN }}
          APP_PRIVATE_KEY: ${{ secrets.RIVET_APP_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createSign } from 'node:crypto';
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const payload = `${encode({alg:'RS256',typ:'JWT'})}.${encode({iat:now-30,exp:now+300,iss:process.env.APP_CLIENT_ID})}`;
          const signature = createSign('RSA-SHA256').update(payload).sign(process.env.APP_PRIVATE_KEY, 'base64url');
          const jwt = `${payload}.${signature}`;
          const request = async route => {
            const response = await fetch(`https://api.github.com${route}`, {
              headers: {Accept:'application/vnd.github+json', Authorization:`Bearer ${jwt}`, 'X-GitHub-Api-Version':'2022-11-28'},
            });
            assert.equal(response.status, 200, `GitHub metadata request failed: ${response.status}`);
            return response.json();
          };
          const app = await request('/app');
          const installation = await request(`/repos/${process.env.GITHUB_REPOSITORY}/installation`);
          assert.equal(app.client_id, process.env.APP_CLIENT_ID);
          assert.equal(app.slug, process.env.APP_SLUG);
          assert.equal(installation.app_id, app.id);
          assert.equal(installation.app_slug, app.slug);
          assert.equal(installation.repository_selection, 'selected');
          assert.deepEqual(installation.events, []);
          assert.deepEqual(installation.permissions, {contents:'write',issues:'write',metadata:'read',pull_requests:'write'});
          console.log(JSON.stringify({repository:process.env.GITHUB_REPOSITORY, app:app.slug, selectedInstallation:true, permissions:installation.permissions}));
          NODE
