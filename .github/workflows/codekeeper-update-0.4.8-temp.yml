name: Verify Codekeeper 0.4.8 test pin

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'chore/update-codekeeper-0.4.8'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact package pin and repository checks
        env:
          EXPECTED_INTEGRITY: 'sha512-cV1pW4tf16SB0af5xcxOAadZ7XwSbG2hRE8xfoC2lrcsspojGJtGqfbBN3VJfqxgPSCn/iCRJKaLEY4UMJVRyw=='
        run: |
          set -euo pipefail
          test "$(grep -c 'package_version: \"0.4.8\"' .github/workflows/codekeeper.yml)" -eq 5
          test "$(grep -Fc "$EXPECTED_INTEGRITY" .github/workflows/codekeeper.yml)" -eq 5
          ! grep -Fq '0.4.7' .github/workflows/codekeeper.yml
          npm test
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/codekeeper.yml"); puts "parsed codekeeper.yml"'
          echo "CODEKEEPER_WORKFLOW_SHA256=$(sha256sum .github/workflows/codekeeper.yml | cut -d' ' -f1)"
