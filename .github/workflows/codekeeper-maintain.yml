# Generated by codekeeper from coryparry/Codekeeper@ee791d7fdcbfb55c076c8307f9671c278eaf8e12.
name: Codekeeper maintenance

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyse and seal without GitHub mutation
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: Codekeeper pinned tooling bootstrap
    runs-on: ${{ vars.CODEKEEPER_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: coryparry/Codekeeper/tools/codekeeper@ee791d7fdcbfb55c076c8307f9671c278eaf8e12
        with:
          artifact-name: codekeeper-tooling-${{ github.run_id }}
  maintain:
    needs: bootstrap
    uses: coryparry/Codekeeper/.github/workflows/codekeeper-maintain.yml@ee791d7fdcbfb55c076c8307f9671c278eaf8e12
    with:
      enabled: ${{ vars.CODEKEEPER_ENABLED == 'true' }}
      runner: ${{ vars.CODEKEEPER_RUNNER || 'ubuntu-latest' }}
      codex_safety_strategy: ${{ vars.CODEKEEPER_CODEX_SAFETY_STRATEGY || 'drop-sudo' }}
      dry_run: ${{ inputs.dry_run || false }}
      # Optional for dry_run=true; required when dry_run=false publishes changes.
      app_client_id: ${{ vars.CODEKEEPER_APP_CLIENT_ID }}
    secrets:
      # Match this secret to ai.agents.audit.provider in .github/codekeeper.json.
      model_api_key: ${{ secrets.OPENAI_API_KEY }}
      # Required while this mode keeps workspace.enabled=true.
      workspace_api_key: ${{ secrets.OPENAI_API_KEY }}
      # Always a separate OpenAI trace-export key, never the model-provider key.
      trace_api_key: ${{ secrets.OPENAI_TRACE_API_KEY }}
      # Optional for dry_run=true; required when dry_run=false publishes changes.
      app_private_key: ${{ secrets.CODEKEEPER_APP_PRIVATE_KEY }}
