# Generated by the Codekeeper installer from one exact published package release.
name: Codekeeper maintenance
run-name: "Codekeeper maintenance verification ${{ inputs.verification_id || github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run report-only analysis (true) or manually allow live GitHub mutation (false)
        required: true
        type: boolean
        default: true
      verification_id:
        description: Unique installer verification correlation ID; leave empty for ordinary runs
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  maintain:
    uses: ./.github/workflows/codekeeper-runtime-maintain.yml
    with:
      package_version: "0.3.4"
      package_integrity: "sha512-aDJL99HhBXYzdNH8fbB9oiv37BpEQPgc5k5ispXXvNGoN0L2D7OrfO52Jw7xwTCgnJdDp6xWMyMuV4ZkghwqEw=="
      enabled: ${{ vars.CODEKEEPER_ENABLED == 'true' }}
      # Scheduled runs are report-only. A manual dispatch can explicitly choose dry or live mode.
      dry_run: ${{ github.event_name == 'schedule' || inputs.dry_run }}
      # Optional for dry_run=true; required when dry_run=false publishes changes.
      app_client_id: ${{ vars.CODEKEEPER_APP_CLIENT_ID }}
      app_contents_permission: "read"
      app_issues_permission: "write"
      app_pull_requests_permission: "read"
    secrets:
      # Match this secret to ai.agents.audit.provider in .github/codekeeper.json.
      model_api_key: ${{ secrets.OPENAI_API_KEY }}
      # Required while this mode keeps workspace.enabled=true.
      workspace_api_key: ${{ secrets.OPENAI_API_KEY }}
      # Always a separate OpenAI trace-export key, never the model-provider key.
      trace_api_key: ${{ secrets.OPENAI_TRACE_API_KEY }}
      # Optional for dry_run=true; required when dry_run=false publishes changes.
      app_private_key: ${{ secrets.CODEKEEPER_APP_PRIVATE_KEY }}
