name: Verify OpenAI secret boundary

on:
  push:
    branches:
      - codex/verify-openai-secret-boundary

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ vars.CODEKEEPER_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Verify the injected key with Luna
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --input-type=module - <<'NODE'
          const key = process.env.OPENAI_API_KEY ?? "";
          const metadata = {
            length: key.length,
            expectedPrefix: key.startsWith("sk-proj-"),
            hasWhitespace: /\s/.test(key),
          };
          const response = await fetch("https://api.openai.com/v1/responses", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${key}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model: "gpt-5.6-luna",
              input: "Return only OK.",
              max_output_tokens: 16,
              store: false,
            }),
          });
          const body = await response.json().catch(() => ({}));
          const detail = response.ok
            ? { responseCreated: typeof body.id === "string", model: body.model, status: body.status }
            : { message: body?.error?.message, code: body?.error?.code, type: body?.error?.type };
          console.log(JSON.stringify({ metadata, httpStatus: response.status, detail }));
          if (!response.ok) process.exitCode = 1;
          NODE
