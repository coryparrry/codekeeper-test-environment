name: Verify Codekeeper 0.4.9 test pin

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'chore/update-codekeeper-0.4.9'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/update-codekeeper-0.4.9
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify the exact package pin and repository checks
        env:
          EXPECTED_INTEGRITY: 'sha512-nYwFsY/xgc9P7m1jhE4Uf9TGy8CtrpUaHwzJvCabweMmVUft0Pn1ac25JnQFhFMKm7vXYyuOtxiOTH+lhPNHHw=='
        run: |
          set -euo pipefail
          test "$(grep -c 'package_version: \"0.4.9\"' .github/workflows/codekeeper.yml)" -eq 5
          test "$(grep -Fc "$EXPECTED_INTEGRITY" .github/workflows/codekeeper.yml)" -eq 5
          ! grep -Fq '0.4.8' .github/workflows/codekeeper.yml
          npm test
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/codekeeper.yml"); puts "parsed codekeeper.yml"'
          echo "CODEKEEPER_WORKFLOW_SHA256=$(sha256sum .github/workflows/codekeeper.yml | cut -d' ' -f1)"
