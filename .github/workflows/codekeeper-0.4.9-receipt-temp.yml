name: Read Codekeeper 0.4.9 npm receipt

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  receipt:
    if: github.event.pull_request.head.ref == 'chore/update-codekeeper-0.4.9'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Read the exact public package receipt
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/codekeeper-0.4.9.json"
          error_log="$RUNNER_TEMP/npm-view-error.log"
          for attempt in $(seq 1 24); do
            if npm view '@coryparry/codekeeper@0.4.9' version dist.integrity dist.tarball --json > "$receipt" 2> "$error_log"; then
              if RECEIPT="$receipt" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RECEIPT"]).read_text())
          if isinstance(value, list):
              if len(value) != 1 or not isinstance(value[0], dict):
                  raise SystemExit(1)
              value = value[0]
          if not isinstance(value, dict):
              raise SystemExit(1)
          integrity = value.get("dist.integrity") or (value.get("dist") or {}).get("integrity")
          tarball = value.get("dist.tarball") or (value.get("dist") or {}).get("tarball")
          if value.get("version") != "0.4.9":
              raise SystemExit(1)
          if not isinstance(integrity, str) or not integrity.startswith("sha512-"):
              raise SystemExit(1)
          if not isinstance(tarball, str) or not tarball.startswith("https://registry.npmjs.org/"):
              raise SystemExit(1)
          print("CODEKEEPER_NPM_RECEIPT=" + json.dumps({
              "version": value["version"],
              "integrity": integrity,
              "tarball": tarball,
          }, separators=(",", ":")))
          PY
              then
                exit 0
              fi
            fi
            if [ "$attempt" -eq 24 ]; then
              cat "$error_log" >&2 || true
              echo 'Codekeeper 0.4.9 is not available with a valid public receipt' >&2
              exit 1
            fi
            sleep 5
          done
